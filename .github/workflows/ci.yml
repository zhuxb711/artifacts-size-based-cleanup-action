name: Action CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CITest:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc --noEmit -p tsconfig.build.json

      - name: Test cleanup behavior
        run: yarn node --experimental-vm-modules --test --test-timeout=10000 .github/tests/cleanup.test.mjs

      - name: Build action
        run: yarn dlx @vercel/ncc build src/index.ts --target es2022

      - name: Check bundled JavaScript syntax
        run: node --check dist/index.js
